name: build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - name: Install Target
      run: rustup target install thumbv7em-none-eabihf
    - uses: actions/checkout@v2
    - name: Build
      run: cargo build --target=thumbv7em-none-eabihf --verbose
    - name: Run tests
      run: cargo test --verbose

# Superseded PR validation must not hold runner capacity.
concurrency:
  group: pr-ci-main.yml-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true
